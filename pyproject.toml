[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "bridge-safety-inspector"
version = "0.1.0"
description = "Automated Structural Bridge Safety Inspector"
readme = "README.md"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
training = [
    "joblib>=1.3",
    "numpy>=1.26",
    "Pillow>=10",
    "scikit-image>=0.22",
    "scikit-learn>=1.4",
]
dashboard = ["streamlit>=1.35"]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
